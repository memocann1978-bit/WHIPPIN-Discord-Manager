name: Windows Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WHIPPIN-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release for in-app updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: WHIPPIN v0.2.0
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          make_latest: true
          fail_on_unmatched_files: true
