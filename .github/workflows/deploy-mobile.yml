name: Deploy WHIPPIN Mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/mobile.tsx','src/mobile.css','mobile.html','worker/**','public/**','vite.config.ts','wrangler.toml','.github/workflows/deploy-mobile.yml','MOBILE_SETUP.md']
permissions:
  contents: read
concurrency:
  group: whippin-mobile-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MOBILE_SECRETS_READY: ${{ secrets.DISCORD_CLIENT_ID != '' && secrets.DISCORD_CLIENT_SECRET != '' && secrets.DISCORD_BOT_TOKEN != '' && secrets.ADMIN_DISCORD_USER_ID != '' && secrets.WHIPPIN_SESSION_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy Worker and mobile web app
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure Worker secrets
        if: env.MOBILE_SECRETS_READY == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ADMIN_DISCORD_USER_ID: ${{ secrets.ADMIN_DISCORD_USER_ID }}
          WHIPPIN_SESSION_SECRET: ${{ secrets.WHIPPIN_SESSION_SECRET }}
        run: |
          printf '%s' "$DISCORD_CLIENT_ID" | npx --yes wrangler@4 secret put DISCORD_CLIENT_ID
          printf '%s' "$DISCORD_CLIENT_SECRET" | npx --yes wrangler@4 secret put DISCORD_CLIENT_SECRET
          printf '%s' "$DISCORD_BOT_TOKEN" | npx --yes wrangler@4 secret put DISCORD_BOT_TOKEN
          printf '%s' "$ADMIN_DISCORD_USER_ID" | npx --yes wrangler@4 secret put ADMIN_DISCORD_USER_ID
          printf '%s' "$WHIPPIN_SESSION_SECRET" | npx --yes wrangler@4 secret put SESSION_SECRET
